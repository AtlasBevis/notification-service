server:
  host: "0.0.0.0"
  port: 8080
  base_path: "/notification"
  profile: job
  version: "0.1.0"
  metrics:
    enabled: true
    port: 9090
  grpc:
    enabled: false
    port: 50051
  http:
    timeout: 60

auth:
  enabled: false
  admin: ""
  api_key: ""

postgres:
  host: "127.0.0.1"
  port: 5432
  username: "notification"
  password: ""
  database: "notification"
  max_pool_size: 10

kafka:
  enabled: true
  brokers:
    - "localhost:9092"
  client_id: "app-notification"
  timeout: 10
  security_protocol: SASL_PLAINTEXT
  sasl:
    mechanism: SCRAM-SHA-512
    username: "notification"
    password: ""
  topics:
    notify: "notification.notify"
  consumer:
    enabled: true
    max_wait_ms: 1000
    max_poll_records: 100
    start_offset: latest

smtp:
  host: "smtp.office365.com"
  username: ""
  password: ""
