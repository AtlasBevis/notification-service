[package]
name = "data-notification"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
bytes = "1.12.1"
futures = { version = "0.3.34", features = ["executor", "thread-pool"] }
chrono = { version = "0.4.45", features = ["serde"] }
rskafka = "0.6.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
async-trait = "0.1.92"
base64 = "0.23.1"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
reqwest-middleware = "0.5.2"
http = "1.5.0"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls-tls"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = { version = "0.14.2", features = ["rt_tokio_1"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"

[[bin]]
name = "data-notification"
path = "src/main.rs"

[[bin]]
name = "notification-job"
path = "src/bin/notification_job.rs"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
tonic-prost-build = "0.14.6"
