server:
  host: "0.0.0.0"
  port: 8080
  base_path: "/notification"
  profile: app
  version: "0.1.0"
  metrics:
    enabled: true
    port: 9090
  grpc:
    enabled: true
    port: 50051
  http:
    timeout: 60

auth:
  enabled: true
  admin: "<key_admin>"
  api_key: "<api-key>"

postgres:
  host: "<host>"
  port: 5432
  username: "notification"
  password: "<password>"
  database: "notification"
  max_pool_size: 10

kafka:
  enabled: true
  brokers:
    - "localhost:9094"
  client_id: "notification"
  timeout: 10
  security_protocol: SASL_PLAINTEXT
  sasl:
    mechanism: SCRAM-SHA-512
    username: "notification"
    password: "<password>"
  topics:
    notify: "notification.notify"
  consumer:
    enabled: false
    max_wait_ms: 1000
    max_poll_records: 100
    start_offset: latest

smtp:
  host: "smtp.office365.com"
  username: ""
  password: ""
